# ============================================================
# 插件选择文件 plugins.conf
# 编译时可选插件开关：每行一个插件，只填 y 或 n
#   y = 启用该插件（自动写入 .config 参与编译）
#   n = 禁用该插件（不参与编译）
# 支持 # 注释行与空行；修改后重新触发编译即可生效，无需改 .config
# 默认状态：已启用 adbyby-plus / passwall / ttyd / store / mosdns / taskplan，其余全部关闭
# ============================================================

# ---------- 已启用插件（默认） ----------
luci-app-adbyby-plus=y
luci-app-passwall=y
luci-app-ttyd=y
luci-app-store=y
luci-app-mosdns=y
luci-app-taskplan=y

